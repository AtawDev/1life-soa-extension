<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1Life Exported Statement of Account</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="../icons/icon32.png" alt="1Life" class="topbar-icon" />
      <span id="cat-badge" class="cat-badge">Loading...</span>
      <span id="summary-text" class="summary-text"></span>
    </div>

    <div class="topbar-right">
      <button id="btn-toggle-drawer" class="btn-tool" type="button" disabled>
        <span>Patients List</span>
      </button>
      <button id="btn-convert-word" class="btn-tool btn-word" type="button" title="Convert this exported PDF 1:1 to an editable Microsoft Word (.docx) file" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <path d="M8.5 13l1.3 5 1.7-4 1.7 4 1.3-5" />
        </svg>
        <span id="btn-convert-word-label">Convert to Word (.docx)</span>
      </button>
      <button id="btn-download" class="btn-tool btn-primary" type="button" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span>Download PDF</span>
      </button>
      <button id="btn-open-raw" class="btn-tool" type="button" title="Open raw PDF blob in a plain Chrome tab" disabled>
        <span>Raw PDF ↗</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <div id="error-state" class="error-state hidden">
      <h2 id="error-title">Export Not Found</h2>
      <p id="error-msg">This exported PDF may have expired. Click the 1Life SOA Filter extension on the original PDF to export again.</p>
    </div>

    <iframe id="pdf-frame" class="pdf-frame hidden" title="Filtered Statement of Account PDF"></iframe>

    <aside id="drawer" class="drawer hidden" aria-label="Exported patients list">
      <div class="drawer-header">
        <div>
          <h2 id="drawer-title">Exported Patients</h2>
          <div id="drawer-sub" class="drawer-sub"></div>
        </div>
        <button id="btn-close-drawer" class="drawer-close" type="button" aria-label="Close">&times;</button>
      </div>

      <div class="drawer-actions">
        <button id="btn-copy-names" class="btn-drawer" type="button">Copy Names</button>
        <button id="btn-csv" class="btn-drawer" type="button">Download CSV</button>
      </div>

      <div id="drawer-list" class="drawer-list"></div>
    </aside>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
